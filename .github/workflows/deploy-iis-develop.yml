name: Deploy Angular to Local IIS (Develop)

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: [self-hosted]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build -- --configuration production

      - name: Stop IIS Site
        run: |
          Import-Module WebAdministration
          Stop-WebSite -Name "myGitActions"

      - name: Deploy to IIS
        run: |
          Remove-Item "C:\inetpub\wwwroot\GitActions\*" -Recurse -Force
          Copy-Item "dist\myGitActions\browser\*" "C:\inetpub\wwwroot\GitActions\" -Recurse -Force

      - name: Start IIS Site
        run: |
          Import-Module WebAdministration
          Start-WebSite -Name "myGitActions"
